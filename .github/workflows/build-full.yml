on:
  push:
    branches:
    - "main"
  pull_request:
    branches:
    - "*"

jobs:
  tests:
    name: tests (${{ matrix.os }}, Nim ${{ matrix.nimversion }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        nimversion:
          - '2.0.14'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install Nim
      uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: ${{ matrix.nimversion }}

    - name: Install Atlas
      run: |
        mkdir -p "$HOME/.local/bin"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        curl -fsSL https://raw.githubusercontent.com/nim-lang/atlas/HEAD/install.sh | \
          ATLAS_INSTALL_DIR="$HOME/.local/bin" bash -
        atlas -v

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: deps/
        key: ${{ runner.os }}-nim${{ matrix.nimversion }}-${{ hashFiles('dmon.nimble') }}

    - name: Install dependencies
      run: atlas install

    - name: Run tests
      run: atlas-run tests

    - name: Run tests without logging
      run: atlas-run tests -- -d:noLogging

    - name: Test BSD backend
      if: runner.os == 'Linux'
      run: atlas-run tests testbsd.nim -- -d:bsdTest

    - name: Compile BSD targets
      if: runner.os == 'Linux'
      run: |
        nim c --compileOnly --os:freebsd src/dmon.nim
        nim c --compileOnly --os:openbsd src/dmon.nim
        nim c --compileOnly --os:netbsd src/dmon.nim
